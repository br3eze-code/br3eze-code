apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentos.serviceAccountName" . }}
      containers:
        - name: agentos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.runtime.port | quote }}
            - name: GATEWAY_PORT
              value: {{ .Values.runtime.port | quote }}
            - name: AGENTOS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secretName | quote }}
                  key: gateway-token
                  optional: true
            - name: AUDIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secretName | quote }}
                  key: audit-secret
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secretName | quote }}
                  key: gemini-api-key
                  optional: true
            - name: DRIVER_MIKROTIK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secretName | quote }}
                  key: mikrotik-api-token
                  optional: true
          livenessProbe:
            httpGet:
              path: {{ .Values.runtime.healthPath }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.runtime.healthPath }}
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
