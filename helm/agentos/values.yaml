replicaCount: 1

image:
  repository: ghcr.io/br3eze-code/br3eze-code
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: agentos
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 19876

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: agentos.br3eze.africa
      paths:
        - path: /
          pathType: Prefix
  tls: []

runtime:
  port: 19876
  healthPath: /health
  secretName: agentos

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

workspace:
  content: "{}"
