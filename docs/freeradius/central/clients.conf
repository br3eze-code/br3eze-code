# Only registered regional proxies may send requests to central FreeRADIUS.
client regional-proxy-west {
  ipaddr = 10.70.1.10
  secret = CHANGE_ME_REGIONAL_PROXY_TO_CENTRAL_SECRET
  shortname = regional-proxy-west
  nas_type = other
  limit {
    max_connections = 256
    lifetime = 0
    idle_timeout = 0
  }
}

client regional-proxy-east {
  ipaddr = 10.70.2.10
  secret = CHANGE_ME_EAST_PROXY_TO_CENTRAL_SECRET
  shortname = regional-proxy-east
  nas_type = other
  limit {
    max_connections = 256
    lifetime = 0
    idle_timeout = 0
  }
}

