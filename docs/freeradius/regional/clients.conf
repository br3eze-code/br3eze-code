# Regional MikroTik NAS clients.
# One unique secret per router/site. Replace placeholders before deployment.
client mikrotik-site-nbo-01 {
  ipaddr = 10.60.1.1
  secret = CHANGE_ME_NBO_SITE_01_RADIUS_SECRET
  shortname = mikrotik-site-nbo-01
  nas_type = mikrotik
  limit {
    max_connections = 64
    lifetime = 0
    idle_timeout = 0
  }
}

client mikrotik-site-kis-01 {
  ipaddr = 10.60.2.1
  secret = CHANGE_ME_KIS_SITE_01_RADIUS_SECRET
  shortname = mikrotik-site-kis-01
  nas_type = mikrotik
  limit {
    max_connections = 64
    lifetime = 0
    idle_timeout = 0
  }
}

# Central FreeRADIUS peer reached through WireGuard/IPsec/private routing.
# The central server must register this proxy using the same secret.
client central-radius {
  ipaddr = 10.70.0.10
  secret = CHANGE_ME_REGIONAL_PROXY_TO_CENTRAL_SECRET
  shortname = regional-proxy-west
  nas_type = other
}
