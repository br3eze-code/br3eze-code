#      --member="serviceAccount:agentos-sa@br3eze-africa-312df.iam.gserviceaccount.com" \
#      --role="roles/secretmanager.secretAccessor" \
#      --project=br3eze-africa-312df
#
# 4. Deploy
#    gcloud run services replace hosting.yaml \
#      --region=africa-south1 \
#      --project=br3eze-africa-312df
