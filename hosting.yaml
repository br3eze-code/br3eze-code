# 5. Allow unauthenticated (hotspot portal & webhook)
#    gcloud run services add-iam-policy-binding agentos \
#      --region=africa-south1 \
#      --member="allUsers" \
#      --role="roles/run.invoker" \
#      --project=br3eze-africa-312df
##############################################################################