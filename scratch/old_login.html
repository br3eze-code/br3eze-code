<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Power Connect - Sign In</title>
  <link rel="icon" href="images/logo/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <div id="authScreen">
    <div class="auth-container">
      
      <!-- LOGIN FORM -->
      <div class="card auth-card" id="loginForm">
        <div class="auth-header">
          <img src="images/logo/logo.png" alt="Power Connect Logo" class="auth-logo">
          <h2>Power Connect</h2>
          <p>Sign in to access the high-speed network</p>
        </div>

        <!-- Hidden form for actual MikroTik login submission -->
        <form id="mikrotik-form" name="login" action="$(link-login-only)" method="post" style="display:none;">
          <input type="hidden" name="dst" value="$(link-orig)" />
          <input type="hidden" name="popup" value="true" />
          <input type="hidden" name="username" id="mk-username" />
          <input type="hidden" name="password" id="mk-password" />
        </form>

        <form id="loginFormElement">
          <div class="form-group">
            <label>Username, Email or Voucher</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input type="text" id="loginIdentifier" placeholder="Enter username or voucher" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label>Password (Leave blank for voucher)</label>
            <div class="input-wrapper">
              <i class="fas fa-key"></i>
              <input type="password" id="loginPassword" placeholder="ΓÇóΓÇóΓÇóΓÇóΓÇóΓÇóΓÇóΓÇó" autocomplete="current-password" style="padding-right: 48px;">
              <button type="button" class="qr-btn" title="Scan QR Code" onclick="scanQRCode()">
                <i class="fas fa-qrcode"></i>
              </button>
            </div>
          </div>

          <div id="qr-reader" style="display:none;"></div>

          <button type="submit" class="btn-primary" id="login-submit-btn">Connect to WiFi</button>
        </form>

        <div class="auth-divider">
          <hr>
          <span>or continue with</span>
          <hr>
        </div>

        <button type="button" class="google-btn" id="googleSignInBtn" onclick="Auth.loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          Sign in with Google
        </button>

        <div id="error-message"></div>

        <div class="auth-toggle">Need an account? <a onclick="toggleAuthForm()">Sign up</a></div>
      </div>

      <!-- SIGNUP FORM -->
      <div class="card auth-card hidden" id="signupForm">
        <div class="auth-header">
          <img src="images/logo/logo.png" alt="Power Connect Logo" class="auth-logo">
          <h2>Create Account</h2>
          <p>Join Power Hotspot today</p>
        </div>
        
        <form id="signupFormElement">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrapper">
              <i class="fas fa-user-circle"></i>
              <input type="text" id="signupFullname" placeholder="John Doe" autocomplete="name" required>
            </div>
          </div>
          
          <div class="form-group">
            <label>Username</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input type="text" id="signupUsername" placeholder="johndoe" autocomplete="username" required>
            </div>
          </div>
          
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope"></i>
              <input type="email" id="signupEmail" placeholder="john@example.com" required autocomplete="email">
            </div>
          </div>
          
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" id="signupPassword" placeholder="ΓÇóΓÇóΓÇóΓÇóΓÇóΓÇóΓÇóΓÇó" required autocomplete="new-password" minlength="6">
            </div>
          </div>
          
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrapper">
              <i class="fas fa-shield-alt"></i>
              <input type="password" id="signupConfirmPassword" placeholder="ΓÇóΓÇóΓÇóΓÇóΓÇóΓÇóΓÇóΓÇó" required autocomplete="new-password" minlength="6">
            </div>
          </div>
          
          <button type="submit" class="btn-primary">Γ£¿ Create Account</button>
        </form>
        
        <div class="auth-toggle">Already have an account? <a onclick="toggleAuthForm()">Login</a></div>
      </div>
      
    </div>
  </div>

  <!-- Dynamic Environment Variables -->
  <script src="js/env.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/login-inline.js"></script>

  <div id="toast" class="toast">
    <span id="toastIcon"></span>
    <span id="toastMessage"></span>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="close-modal" onclick="UI.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/datastore.js"></script>
  <script src="js/html5-qrcode.min.js"></script>
  <script src="js/auth.js"></script>
  
</body>

</html>
