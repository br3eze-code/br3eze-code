name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, upgrade/commerce-domains]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Duplicate exports and new lint blockers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI quality gate
        env:
          CI_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: npm run check:ci-quality
