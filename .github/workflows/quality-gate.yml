name: CI Quality Gate (manual diagnostic)

# The canonical CI workflow now runs these same checks on every main push and PR.
# Keep this workflow available for explicit diagnostics without duplicating CI runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Manual architecture and quality diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          echo "sha=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
      - name: Run architecture gate
        run: npm run check:architecture

      - name: Run CI quality gate
        env:
          CI_BASE_SHA: ${{ github.sha }}
        run: npm run check:ci-quality
