name: Firebase Deploy

# Runs after a GitHub Release is published (see release.yml), or manually.
# Deploys the shared dist-web/ artifact to Firebase Hosting, server/ as the "api" Cloud Function,
# and firestore.rules / firestore.indexes.json — everything firebase.json
# points at. Does NOT touch the Cloud Run deployment (apphosting.yaml) or
# Kubernetes (deploy.yml) — those are separate, unrelated targets.

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/vercel-build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/generate-env-www.js'
      - 'server/**'
      - 'api/chat/otp/**'
      - 'src/adapters/auth/supabase.js'
      - 'src/api/routes/firebase-data-session.js'
      - 'src/adapters/firebase/admin.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'apphosting.yaml'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Restrict deploy to one target (leave blank for everything)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - hosting
          - functions
          - firestore

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    # Main pushes and manual dispatches are the only Firebase deployment paths.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Install functions dependencies
        working-directory: server
        run: |
          # server/ currently has no lockfile. npm ci therefore cannot work here.
          # Keep this explicit until server/package-lock.json is intentionally added.
          npm install --ignore-scripts --no-audit --no-fund

      - name: Validate secrets
        id: validate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wgybhjqaulxqdfxpouwf.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_limu7EaVkGn4V9t6TmrztQ_MGiY4UJE' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing; Firebase deploy cannot authenticate."
            exit 1
          fi
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const x=JSON.parse(s);if(!x.client_email||!x.private_key||!x.project_id)process.exit(1)}catch{process.exit(1)}})"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT must be valid service-account JSON with client_email, private_key, and project_id."
            exit 1
          fi
          echo "✓ Firebase service-account JSON is structurally valid"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Supabase project URL and publishable key could not be resolved for the human-auth boundary."
            exit 1
          fi
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *)
            echo "::error::SUPABASE_URL must be the HTTPS Supabase project URL."
            exit 1
          esac
          echo "✓ Supabase Auth runtime configuration is present"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: br3eze-africa-312df
          create_credentials_file: true
          export_environment_variables: true

      - name: Write CI .env for the shared web build
        # Firebase's checked-in Android client config contains the public project
        # settings required by the web SDK. Keep secrets out of the browser bundle.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wgybhjqaulxqdfxpouwf.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_limu7EaVkGn4V9t6TmrztQ_MGiY4UJE' }}
          SUPABASE_OAUTH_REDIRECT: ${{ secrets.SUPABASE_OAUTH_REDIRECT }}
          AGENTOS_API_BASE_URL: ${{ secrets.AGENTOS_API_BASE_URL || 'https://br3eze.africa' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const client = config.client?.find((item) => item.client_info?.android_client_info?.package_name === 'africa.br3eze') || config.client?.[0];
          const project = config.project_info || {};
          const apiKey = client?.api_key?.find((item) => item.current_key)?.current_key;
          const appId = client?.client_info?.mobilesdk_app_id;
          const values = {
            FIREBASE_API_KEY: apiKey,
            FIREBASE_WEB_API_KEY: apiKey,
            FIREBASE_AUTH_DOMAIN: project.project_id ? project.project_id + '.firebaseapp.com' : '',
            FIREBASE_DATABASE_URL: project.firebase_url || '',
            FIREBASE_PROJECT_ID: project.project_id || '',
            FIREBASE_STORAGE_BUCKET: project.storage_bucket || '',
            FIREBASE_MESSAGING_SENDER_ID: project.project_number || '',
            FIREBASE_APP_ID: appId || '',
            SUPABASE_URL: process.env.SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: process.env.SUPABASE_PUBLISHABLE_KEY,
            SUPABASE_OAUTH_REDIRECT: process.env.SUPABASE_OAUTH_REDIRECT,
            API_BASE_URL: process.env.AGENTOS_API_BASE_URL,
            AGENTOS_API_BASE_URL: process.env.AGENTOS_API_BASE_URL
          };
          if (!values.FIREBASE_API_KEY || !values.FIREBASE_PROJECT_ID || !values.FIREBASE_APP_ID) {
            throw new Error('google-services.json is missing required Firebase client configuration.');
          }
          const body = Object.entries(values)
            .filter(([, value]) => typeof value === 'string' && value.length > 0)
            .map(([key, value]) => key + '=' + value.replace(/[\\r\\n]/g, ''))
            .join('\\n') + '\\n';
          fs.writeFileSync('.env', body, { mode: 0o600 });
          console.log('✓ Generated browser-safe Firebase and Supabase runtime configuration.');
          NODE

      - name: Write Functions runtime environment
        # Firebase Functions reads .env from its configured source directory (server/).
        # Only the public Supabase project URL/key are required to verify user tokens.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wgybhjqaulxqdfxpouwf.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_limu7EaVkGn4V9t6TmrztQ_MGiY4UJE' }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
          } > server/.env

      - name: Deploy
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            echo "Deploying: $ONLY"
            npx firebase-tools deploy --only "$ONLY" --project br3eze-africa-312df --non-interactive
          else
            echo "Deploying: hosting, functions, firestore"
            npx firebase-tools deploy --only hosting,functions,firestore --project br3eze-africa-312df --non-interactive
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-key.json" "$GOOGLE_APPLICATION_CREDENTIALS" .env server/.env
