name: Google Play Rollout

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'config.xml'
      - 'package.json'
      - 'custom-plugins/**'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: false
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

jobs:
  cordova-build:
    name: Cordova Build & Sign
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node deps
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Cordova CLI
        run: npm install -g cordova@13

      - name: Add Android platform
        run: cordova platform add android --save || true

      - name: Cordova prepare
        run: cordova prepare android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore

      - name: Cordova build release APK/AAB
        run: |
          cordova build android --release \
            -- \
            --keystore=/tmp/release.keystore \
            --storePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            --password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Find built AAB/APK
        id: find_apk
        run: |
          AAB=$(find platforms/android -name "*.aab" | head -1)
          APK=$(find platforms/android -name "*-release*.apk" | head -1)
          echo "aab=$AAB" >> $GITHUB_OUTPUT
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Built: AAB=$AAB  APK=$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentos-release-${{ github.run_number }}
          path: |
            ${{ steps.find_apk.outputs.aab }}
            ${{ steps.find_apk.outputs.apk }}
          retention-days: 30

      - name: Publish to Google Play
        if: steps.find_apk.outputs.aab != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.br3eze.agentos
          releaseFiles: ${{ steps.find_apk.outputs.aab }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          changesNotSentForReview: false

      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/release.keystore
