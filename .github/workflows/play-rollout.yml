name: Google Play Rollout

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'config.xml'
      - 'package.json'
      - 'custom-plugins/**'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: false
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      version_code:
        description: 'Override versionCode (leave blank for auto)'
        required: false

permissions:
  contents: read

jobs:
  cordova-build:
    name: Cordova Build & Sign → ${{ github.event.inputs.track || 'internal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install Node deps
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Cordova CLI
        run: npm install -g cordova@13

      - name: Set versionCode
        id: vc
        run: |
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            VC="${{ github.event.inputs.version_code }}"
          else
            VC="${{ github.run_number }}"
          fi
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "📱 versionCode: $VC"

      - name: Add Android platform
        run: cordova platform add android@12 --save || true

      - name: Cordova prepare
        run: cordova prepare android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore

      - name: Build release AAB
        run: |
          cordova build android --release \
            -- \
            --keystore=/tmp/release.keystore \
            --storePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            --password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --versionCode="${{ steps.vc.outputs.code }}"

      - name: Locate artifacts
        id: artifacts
        run: |
          AAB=$(find platforms/android -name "*.aab" -not -path "*/debug/*" | head -1)
          APK=$(find platforms/android -name "*-release*.apk" | head -1)
          echo "aab=$AAB" >> $GITHUB_OUTPUT
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "AAB: $AAB  APK: $APK"
          [ -f "$AAB" ] || { echo "❌ No AAB found"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentos-android-${{ steps.vc.outputs.code }}
          path: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.apk }}
          retention-days: 30

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.br3eze.agentos
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 3
          changesNotSentForReview: false
          whatsNewDirectory: ''

      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/release.keystore
