name: Production Docker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GHCR
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  qa:
    name: QA and release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build generated TypeScript artifact
        run: npm run build:product-query

      - name: Check JavaScript syntax
        run: npm run build:check

      - name: Run CI quality gate
        run: npm run check:ci-quality

      - name: Run focused production-control tests
        run: >-
          npm test -- --runInBand
          tests/agent-matrix-registry.test.js
          tests/fleet-health-poller.test.js
          tests/roaming-context.test.js
          tests/resource-governance.test.js
          tests/approval-gate-governance.test.js
          tests/audit-event.test.js
          tests/runtime-config.test.js

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate Dockerfile syntax and Compose source
        run: |
          test -s Dockerfile
          test -s docker-compose.production.yml
          test -s src/workers/fleet-health-worker.js
          grep -q 'FLEET_WORKER_PROVIDER_MODULE' docker-compose.production.yml
          grep -q 'USER agentos' Dockerfile
          grep -q "node.*fleet-health-worker.js" docker-compose.production.yml

  build-and-push:
    name: Build and publish production image
    needs: qa
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish release summary
        run: |
          {
            echo '## Production image published'
            echo
            echo "Image digest: ${{ steps.push.outputs.digest }}"
            echo "Tags:"
            echo '${{ steps.meta.outputs.tags }}'
          } >> "$GITHUB_STEP_SUMMARY"
