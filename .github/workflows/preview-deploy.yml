name: Deploy AgentOS Preview

on:
  push:
    branches: [upgrade/commerce-domains]
    paths:
      - 'src/**'
      - 'server/**'
      - 'helm/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview-deploy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: upgrade/commerce-domains
        type: string

concurrency:
  group: agentos-preview
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate Preview candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Syntax gate
        run: npm run build:check
      - name: Targeted regression tests
        run: npm test -- --runInBand --coverage=false tests/unit/whatsapp-interactive.test.js tests/unit/domain-agnostic-capabilities.test.js tests/unit/runtime.test.js

  build:
    name: Build Preview container
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=preview-,format=short
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Preview Kubernetes
    needs: build
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Validate Preview secrets
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          INGRESS_HOST: ${{ secrets.KUBE_INGRESS_HOST }}
      
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_DATA" || { echo 'Preview secret KUBECONFIG is required'; exit 1; }
          test -n "$INGRESS_HOST" || { echo 'Preview secret KUBE_INGRESS_HOST is required'; exit 1; }
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/preview-kubeconfig"
          echo "KUBECONFIG_PATH=$RUNNER_TEMP/preview-kubeconfig" >> "$GITHUB_ENV"
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Setup Kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - name: Create isolated Preview namespace
        env:
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'agentos-preview' }}
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      - name: Create Preview secrets
        env:
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'agentos-preview' }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIKROTIK_API_TOKEN: ${{ secrets.MIKROTIK_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          kubectl create secret generic agentos \
            --from-literal=gateway-token="$GATEWAY_TOKEN" \
            --from-literal=audit-secret="$AUDIT_SECRET" \
            --from-literal=gemini-api-key="$GEMINI_API_KEY" \
            --from-literal=mikrotik-api-token="$MIKROTIK_API_TOKEN" \
            --from-literal=aws-access-key-id="$AWS_ACCESS_KEY_ID" \
            --from-literal=aws-secret-access-key="$AWS_SECRET_ACCESS_KEY" \
            --from-literal=gcp-sa-key="${GCP_SA_KEY:-{}}" \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      - name: Create Preview workspace ConfigMap
        env:
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'agentos-preview' }}
        run: |
          if [ -f workspace.json ]; then
            kubectl create configmap agentos-workspace \
              --from-file=workspace.json=./workspace.json \
              -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          else
            echo 'workspace.json not present; retaining any existing Preview workspace ConfigMap'
          fi
      - name: Helm upgrade Preview
        env:
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'agentos-preview' }}
          INGRESS_HOST: ${{ secrets.KUBE_INGRESS_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          helm upgrade --install agentos ./helm/agentos \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="${REGISTRY}/${IMAGE_NAME}" \
            --set image.tag="$IMAGE_TAG" \
            --set ingress.hosts[0].host="$INGRESS_HOST" \
            --set ingress.tls[0].hosts[0]="$INGRESS_HOST" \
            --wait --timeout 5m
      - name: Verify Preview rollout
        env:
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE || 'agentos-preview' }}
        run: |
          set -euo pipefail
          kubectl rollout status deployment/agentos -n "$NAMESPACE" --timeout=5m
          kubectl get ingress -n "$NAMESPACE"
          echo 'Preview deployment verified; use the configured KUBE_INGRESS_HOST for live smoke checks.'
