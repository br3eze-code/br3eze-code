name: Deploy AgentOS

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch'
    env:
      KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      KUBE_INGRESS_HOST: ${{ secrets.KUBE_INGRESS_HOST }}
      GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
      AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MIKROTIK_API_TOKEN: ${{ secrets.MIKROTIK_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        id: validate
        shell: bash
        run: |
          if [ -z "$KUBECONFIG_SECRET" ]; then
            echo "KUBECONFIG not configured; Kubernetes deployment is skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        if: steps.validate.outputs.configured == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Setup Kubernetes context
        if: steps.validate.outputs.configured == 'true'
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Create namespace
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="${KUBE_NAMESPACE:-agentos}"
          kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="${KUBE_NAMESPACE:-agentos}"
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s\n' \
            "gateway-token=$GATEWAY_TOKEN" \
            "audit-secret=$AUDIT_SECRET" \
            "gemini-api-key=$GEMINI_API_KEY" \
            "mikrotik-api-token=$MIKROTIK_API_TOKEN" \
            "aws-access-key-id=$AWS_ACCESS_KEY_ID" \
            "aws-secret-access-key=$AWS_SECRET_ACCESS_KEY" > "$secret_file"
          kubectl create secret generic agentos \
            --from-env-file="$secret_file" \
            --namespace "$namespace" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ConfigMap
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="${KUBE_NAMESPACE:-agentos}"
          if [ -f workspace.json ]; then
            kubectl create configmap agentos-workspace \
              --from-file=workspace.json=./workspace.json \
              --namespace "$namespace" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Helm upgrade
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          namespace="${KUBE_NAMESPACE:-agentos}"
          ingress_host="${KUBE_INGRESS_HOST:-br3eze.africa}"
          helm upgrade --install agentos ./helm/agentos \
            --namespace "$namespace" \
            --create-namespace \
            --set "image.repository=$REGISTRY/$IMAGE_NAME" \
            --set "image.tag=$IMAGE_TAG" \
            --set "ingress.hosts[0].host=$ingress_host" \
            --wait --timeout 5m

      - name: Verify deployment
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="${KUBE_NAMESPACE:-agentos}"
          kubectl rollout status deployment/agentos --namespace "$namespace" --timeout=5m
          kubectl get ingress --namespace "$namespace"

      - name: Rollback on failure
        if: failure() && steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          namespace="${KUBE_NAMESPACE:-agentos}"
          helm rollback agentos --namespace "$namespace" || echo "Rollback unavailable (possibly first deployment)"
