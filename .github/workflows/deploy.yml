name: Deploy AgentOS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'helm/**'
      - 'Dockerfile'
      - 'package.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      tag:   ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate secrets
        id: validate
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "ℹ️  KUBECONFIG not configured — this repo's real target is Cloud Run (see apphosting.yaml), not Kubernetes. Skipping the k8s deploy (not a failure)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Secrets validated"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.validate.outputs.configured == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Setup Kubernetes context
        if: steps.validate.outputs.configured == 'true'
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Create namespace
        if: steps.validate.outputs.configured == 'true'
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ Namespace: $NAMESPACE"

      - name: Create secrets
        if: steps.validate.outputs.configured == 'true'
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          kubectl create secret generic agentos \
            --from-literal=gateway-token="${{ secrets.GATEWAY_TOKEN }}" \
            --from-literal=audit-secret="${{ secrets.AUDIT_SECRET }}" \
            --from-literal=gemini-api-key="${{ secrets.GEMINI_API_KEY }}" \
            --from-literal=mikrotik-api-token="${{ secrets.MIKROTIK_API_TOKEN }}" \
            --from-literal=aws-access-key-id="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=aws-secret-access-key="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -n "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ Secrets created"

      - name: Create ConfigMap
        if: steps.validate.outputs.configured == 'true'
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          if [ -f workspace.json ]; then
            kubectl create configmap agentos-workspace \
              --from-file=workspace.json=./workspace.json \
              -n "$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Helm upgrade
        if: steps.validate.outputs.configured == 'true'
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          INGRESS_HOST="${{ secrets.KUBE_INGRESS_HOST || 'br3eze.africa' }}"
          # Use short SHA tag (not digest) for Helm image.tag
          IMAGE_TAG="${{ needs.build.outputs.tag }}"

          helm upgrade --install agentos ./helm/agentos \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --set image.tag="$IMAGE_TAG" \
            --set ingress.hosts[0].host="$INGRESS_HOST" \
            --wait --timeout 5m
          echo "✓ Helm upgrade complete — $IMAGE_TAG"

      - name: Verify deployment
        if: steps.validate.outputs.configured == 'true'
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          kubectl rollout status deployment/agentos -n "$NAMESPACE" --timeout=5m
          kubectl get ing -n "$NAMESPACE"
          echo "✓ Deployment verified"

      - name: Rollback on failure
        if: failure() && steps.validate.outputs.configured == 'true'
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          helm rollback agentos -n "$NAMESPACE" || echo "Rollback not available (first deploy)"
