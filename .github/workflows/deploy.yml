name: Deploy AgentOS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'helm/**'
      - 'Dockerfile'
      - 'package.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GCP_PROJECT: br3eze-africa-312df
  GCP_REGION: africa-south1
  CLOUD_RUN_SERVICE: agentos

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      image_uri: ${{ steps.image_uri.outputs.uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image URI output
        id: image_uri
        run: |
          SHORT_SHA="${{ github.sha }}"
          echo "uri=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA:0:7}" >> $GITHUB_OUTPUT

  # ── Cloud Run deploy ────────────────────────────────────────────────────
  deploy-cloudrun:
    name: Deploy to Cloud Run
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ needs.build.outputs.image_uri }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --set-secrets="FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,GATEWAY_TOKEN=GATEWAY_TOKEN:latest" \
            --set-env-vars="NODE_ENV=production,PORT=3000,GCP_PROJECT=${{ env.GCP_PROJECT }},GCP_REGION=${{ env.GCP_REGION }}" \
            --quiet
          echo "✅ Cloud Run deployed"

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --format 'value(status.url)')
          echo "🌍 Service URL: $URL"

  # ── Kubernetes / Helm deploy (optional, skips if KUBECONFIG missing) ────
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push'

    steps:
      - name: Check KUBECONFIG secret
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "KUBECONFIG secret not set — skipping k8s deploy"
            exit 0
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Setup Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Create namespace
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          kubectl create secret generic agentos \
            --from-literal=gateway-token="${{ secrets.GATEWAY_TOKEN }}" \
            --from-literal=gemini-api-key="${{ secrets.GEMINI_API_KEY }}" \
            --from-literal=anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
            -n "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          INGRESS_HOST="${{ secrets.KUBE_INGRESS_HOST || 'agentos.local' }}"
          helm upgrade --install agentos ./helm/agentos \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --set image.tag="${{ needs.build.outputs.digest }}" \
            --set ingress.hosts[0].host="$INGRESS_HOST" \
            --wait --timeout 5m

      - name: Rollback on failure
        if: failure()
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'agentos' }}"
          helm rollback agentos -n "$NAMESPACE" || echo "Rollback not available (first deploy)"
