name: Dependency Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: dependency-sync-main
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  sync:
    name: Synchronize package.json and package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Normalize React type peer set
        run: npm pkg set devDependencies.@types/react-dom='^18.3.7'

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Verify clean immutable install
        run: npm ci --ignore-scripts

      - name: Commit synchronized manifests
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'package.json and package-lock.json are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: synchronize npm manifests'
          git push origin HEAD:main
