name: Prune absorbed branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prune-absorbed-branches
  cancel-in-progress: false

jobs:
  prune:
    name: Delete only verified absorbed branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prune fully merged or explicitly absorbed branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          manifest=".github/branch-absorption.json"
          prs_file="$RUNNER_TEMP/open-prs.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq -s 'add' > "$prs_file"

          if [[ ! -f "$manifest" ]]; then
            echo '{"version":2,"absorbed":[]}' > "$manifest"
          fi

          deleted=()
          skipped=()

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [[ "$branch" == "main" || "$branch" == "HEAD" ]] && continue
            head_sha="$(git rev-parse "$remote_ref")"
            safe=false
            reason=""

            # A branch whose complete commit history is already in main is safe.
            if git merge-base --is-ancestor "$remote_ref" origin/main; then
              safe=true
              reason="all branch commits are already ancestors of main"
            else
              # File-by-file ports need a complete, explicit inventory. A branch/head
              # assertion alone is insufficient: every changed path must be accounted
              # for and each disposition must be backed by a current-main check.
              entry="$(jq -c --arg branch "$branch" '.absorbed[]? | select(.branch == $branch)' "$manifest" | head -n 1 || true)"
              if [[ -n "$entry" ]]; then
                expected_head="$(jq -r '.head' <<< "$entry")"
                absorbed_in="$(jq -r '.absorbedIn' <<< "$entry")"
                reviewed_count="$(jq '.reviewedFiles // [] | length' <<< "$entry")"
                merge_base="$(git merge-base origin/main "$remote_ref" || true)"

                if [[ "$head_sha" == "$expected_head" ]] &&
                   [[ "$reviewed_count" -gt 0 ]] &&
                   [[ -n "$merge_base" ]] &&
                   git cat-file -e "${absorbed_in}^{commit}" 2>/dev/null &&
                   git merge-base --is-ancestor "$absorbed_in" origin/main; then
                  changed_paths="$(git diff --name-only "$merge_base" "$remote_ref" | LC_ALL=C sort -u)"
                  reviewed_paths="$(jq -r '.reviewedFiles[]?.path' <<< "$entry" | LC_ALL=C sort -u)"

                  if [[ -n "$changed_paths" ]] &&
                     diff -u <(printf '%s\n' "$changed_paths") <(printf '%s\n' "$reviewed_paths") >/dev/null; then
                    files_safe=true
                    while IFS= read -r path; do
                      [[ -n "$path" ]] || continue
                      item="$(jq -c --arg path "$path" '.reviewedFiles[] | select(.path == $path)' <<< "$entry" | head -n 1)"
                      disposition="$(jq -r '.disposition // ""' <<< "$item")"
                      target_path="$(jq -r '.targetPath // .path' <<< "$item")"
                      file_reason="$(jq -r '.reason // ""' <<< "$item")"

                      case "$disposition" in
                        identical)
                          if ! git cat-file -e "$remote_ref:$path" 2>/dev/null ||
                             ! git cat-file -e "origin/main:$target_path" 2>/dev/null ||
                             ! git diff --quiet "$remote_ref:$path" "origin/main:$target_path"; then
                            files_safe=false
                            break
                          fi
                          ;;
                        superseded|excluded)
                          if [[ -z "$file_reason" ]]; then
                            files_safe=false
                            break
                          fi
                          if [[ "$disposition" == "superseded" ]] &&
                             ! git cat-file -e "origin/main:$target_path" 2>/dev/null; then
                            files_safe=false
                            break
                          fi
                          ;;
                        *)
                          files_safe=false
                          break
                          ;;
                      esac
                    done <<< "$changed_paths"

                    if [[ "$files_safe" == true ]]; then
                      safe=true
                      reason="every changed path has an explicit verified disposition"
                    fi
                  fi
                fi
              fi
            fi

            if [[ "$safe" != true ]]; then
              skipped+=("$branch (ahead or not completely verified)")
              continue
            fi

            branch_prs="$(jq -r --arg branch "$branch" --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.head.ref == $branch and .head.repo.full_name == $repo) | .number] | .[]' "$prs_file")"
            for pr in $branch_prs; do
              gh pr close "$pr" --comment "This branch is fully absorbed into main ($reason). Closing the obsolete pull request."
            done

            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null; then
              deleted+=("$branch")
              echo "Deleted $branch: $reason"
            else
              skipped+=("$branch (GitHub refused deletion)")
              echo "Could not delete $branch" >&2
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          {
            echo "## Branch cleanup"
            echo "Deleted ${#deleted[@]} branch(es)."
            for branch in "${deleted[@]}"; do printf -- "- %s\n" "$branch"; done
            echo
            echo "Skipped ${#skipped[@]} branch(es)."
            for branch in "${skipped[@]}"; do printf -- "- %s\n" "$branch"; done
          } >> "$GITHUB_STEP_SUMMARY"
