name: Full dependency inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-inventory.yml'
      - 'scripts/audit-lockless-manifests.sh'
      - 'scripts/summarize-multi-manifest-audit.mjs'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit every tracked dependency surface
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare clean audit outputs
        run: |
          mkdir -p .security-review/multi-manifest/raw/root
          mkdir -p .security-review/multi-manifest/raw/server
          mkdir -p .security-review/multi-manifest/raw/cordova-sqlite-storage
          rm -f .security-review/multi-manifest/raw/root/npm-audit.json
          rm -f .security-review/multi-manifest/raw/server/npm-audit.json
          rm -f .security-review/multi-manifest/raw/cordova-sqlite-storage/npm-audit.json

      - name: Audit root lockfile
        shell: bash
        run: npm audit --json > .security-review/multi-manifest/raw/root/npm-audit.json || echo "Root audit returned findings or an error; inspect the JSON artifact."

      - name: Audit server lockfile when present
        shell: bash
        run: |
          if [ -f server/package-lock.json ]; then
            (cd server && npm audit --json) > .security-review/multi-manifest/raw/server/npm-audit.json || echo "Server audit returned findings or an error."
          else
            echo "No server package-lock.json exists in this checkout; skipped."
          fi

      - name: Audit Cordova SQLite lockfile when present
        shell: bash
        run: |
          if [ -f plugins/cordova-sqlite-storage/package-lock.json ]; then
            (cd plugins/cordova-sqlite-storage && npm audit --json) > .security-review/multi-manifest/raw/cordova-sqlite-storage/npm-audit.json || echo "Cordova SQLite audit returned findings or an error."
          else
            echo "No Cordova SQLite package-lock.json exists in this checkout; skipped."
          fi

      - name: Audit manifests without committed lockfiles
        run: bash scripts/audit-lockless-manifests.sh

      - name: Summarise independent audit surfaces
        if: always()
        run: node scripts/summarize-multi-manifest-audit.mjs

      - name: Upload raw reports and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-inventory-${{ github.run_number }}
          path: |
            .security-review/multi-manifest/raw/
            .security-review/multi-manifest/multi-manifest-summary.json
            .security-review/multi-manifest/multi-manifest-summary.md
          if-no-files-found: warn
          retention-days: 30
