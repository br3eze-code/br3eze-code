name: Level 2 Platform Foundation
on:
  pull_request:
    paths:
      - 'src/platform/**'
      - 'tests/platform/**'
      - 'docs/architecture/level-2-application-platform.md'
      - '.github/workflows/platform-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'src/platform/**'
      - 'tests/platform/**'
      - '.github/workflows/platform-foundation.yml'
jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/platform/platform-foundation.test.js
