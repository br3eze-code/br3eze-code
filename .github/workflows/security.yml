name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run full dependency audit
        shell: bash
        run: npm audit --json > npm-audit.json || echo "npm audit returned findings; continuing to summarize all severities"
      - name: Summarise all advisories
        if: always()
        shell: bash
        run: |
          if [ ! -s npm-audit.json ]; then echo "npm audit produced no JSON report"; exit 1; fi
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          for (const severity of ['critical', 'high', 'moderate', 'low', 'info']) {
            console.log(`${severity}: ${counts[severity] || 0}`);
          }
          const advisories = Object.entries(report.vulnerabilities || {});
          for (const [name, item] of advisories) {
            const via = (item.via || []).filter(v => typeof v === 'object');
            console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, advisories: via.map(v => ({ title: v.title, url: v.url, cves: v.cves, range: v.range })) }));
          }
          if ((counts.critical || 0) > 0 || (counts.high || 0) > 0) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-${{ github.run_number }}
          path: npm-audit.json
          retention-days: 30

  security-check-script:
    name: Security check script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run repository security checks
        run: node scripts/security-check.js
        env:
          NODE_ENV: test
          DATA_BACKEND: local
          LLM_PROVIDER: gemini

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality
          config: |
            paths-ignore:
              - 'node_modules'
              - 'platforms'
              - 'www/lib'
              - 'docs'
              - '**/*.min.js'
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript
        continue-on-error: true # CodeQL quota issues shouldn't block

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
