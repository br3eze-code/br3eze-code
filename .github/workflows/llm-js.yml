name: llm-js tests

on:
  pull_request:
    paths:
      - "experiments/llm-js/**"
      - ".github/workflows/llm-js.yml"
  push:
    branches: [main, feat/llm-js-training]
    paths:
      - "experiments/llm-js/**"
      - ".github/workflows/llm-js.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run llm-js unit tests
        run: node --test experiments/llm-js/*.test.js
      - name: Verify measurable Transformer training, held-out evaluation, and checkpoint round trip
        run: node experiments/llm-js/verify-training.js /tmp/verified-transformer-checkpoint.json
      - name: Smoke-test bigram training
        run: node experiments/llm-js/train.js --steps 20 --generate 20 --checkpoint /tmp/llm-js-checkpoint.json
      - name: Train TinyGPT
        run: node experiments/llm-js/train-gpt.js --input experiments/llm-js/fixtures/tiny-corpus.txt --steps 2 --context 4 --width 2 --heads 2 --layers 2 --hidden 4 --generate 2 --checkpoint /tmp/tiny-gpt-checkpoint.json
      - name: Resume TinyGPT from checkpoint
        run: node experiments/llm-js/train-gpt.js --input experiments/llm-js/fixtures/tiny-corpus.txt --resume /tmp/tiny-gpt-checkpoint.json --steps 1 --generate 2 --checkpoint /tmp/tiny-gpt-resumed.json
      - name: Smoke-test depth-based Transformer preset
        run: node experiments/llm-js/train-transformer.js --input experiments/llm-js/fixtures/tiny-corpus.txt --depth 2 --context 4 --steps 2 --generate 2 --checkpoint /tmp/depth-transformer.json
      - name: Smoke-test native Transformer fine-tuning
        run: node experiments/llm-js/finetune-transformer.js --checkpoint /tmp/depth-transformer.json --input experiments/llm-js/fixtures/tiny-corpus.txt --steps 2 --freeze-base --lr 0.001 --output /tmp/depth-transformer-finetuned.json
