name: llm-js tests

on:
  pull_request:
    paths:
      - "experiments/llm-js/**"
      - ".github/workflows/llm-js.yml"
  push:
    branches: [main, feat/llm-js-training]
    paths:
      - "experiments/llm-js/**"
      - ".github/workflows/llm-js.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run llm-js unit tests
        run: node --test experiments/llm-js/*.test.js
      - name: Smoke-test bigram training
        run: node experiments/llm-js/train.js --steps 20 --generate 20 --checkpoint "$RUNNER_TEMP/llm-js-checkpoint.json"
      - name: Smoke-test TinyGPT training
        run: node experiments/llm-js/train-gpt.js --steps 2 --context 4 --width 2 --hidden 4 --generate 2 --checkpoint "$RUNNER_TEMP/tiny-gpt-checkpoint.json"
      - name: Smoke-test configurable Transformer training
        run: node experiments/llm-js/train-transformer.js --steps 2 --context 8 --width 4 --heads 2 --layers 1 --hidden 8 --generate 5 --checkpoint "$RUNNER_TEMP/transformer-checkpoint.json"
