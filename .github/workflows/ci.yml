name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR checks, but never cancel main-branch validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate CI/CD synchronization contract
        run: node scripts/ci/validate-cicd.mjs
      - name: Install Helm for deployment chart validation
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Lint and render the AWS/EKS deployment chart
        run: |
          set -euo pipefail
          helm lint ./helm/agentos
          helm template agentos ./helm/agentos > "$RUNNER_TEMP/agentos-rendered.yaml"
          grep -q '^kind: Deployment$' "$RUNNER_TEMP/agentos-rendered.yaml"
          grep -q '^kind: ServiceAccount$' "$RUNNER_TEMP/agentos-rendered.yaml"
          grep -q '^kind: Service$' "$RUNNER_TEMP/agentos-rendered.yaml"
      - name: Validate repository hygiene
        run: npm run check:repository-hygiene
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Validate Claude Code marketplace and skills
        run: npm run check:claude-plugin
      - name: Run architecture gate
        run: npm run check:architecture
      - name: Run CI quality gate
        env:
          CI_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: npm run check:ci-quality
      - name: Build required native SQLite binding
        run: npm rebuild better-sqlite3 --no-audit --no-fund
      - name: Smoke-test local PWA and API serving
        run: npm run test:serve
        env:
          NODE_ENV: test
          DATA_BACKEND: local
      - name: Validate agent identity authorization boundary
        run: npm test -- --runTestsByPath tests/unit/agent-authorization.test.js --coverage=false
      - name: Test Supabase identity and bearer boundary
        run: npm run test:auth
        env:
          NODE_ENV: test
      - name: Lint maintained pipeline and plugin code
        run: npx eslint src/core/WorkflowEngine.js src/plugins/custom/*.js src/plugins/*.js scripts/check-syntax.mjs --quiet
      - name: Test
        run: npm test -- --ci --forceExit --passWithNoTests
        env:
          NODE_ENV: test
          ROS_HOST: 127.0.0.1
          ROS_PORT: 8728
          ROS_USER: admin
          ROS_PASS: test
          MIKROTIK_HOST: 127.0.0.1
          MIKROTIK_USER: admin
          MIKROTIK_PASS: test
          DATA_BACKEND: local
          FIREBASE_PROJECT_ID: test-project
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          PORT: 3000
          GATEWAY_PORT: 19876
      - name: Test infrastructure reconciliation safety
        run: npm run test:infra
      - name: Validate infrastructure desired-state manifest
        run: npm run infra:plan -- --json
      - name: Test Node.js-native suites
        run: npm run test:node
      - name: Syntax check
        run: npm run build:check
      - name: Type check (jsconfig + tsconfig)
        run: npm run build:types
      - name: Security check script
        run: npm run security:audit
        env:
          NODE_ENV: test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
