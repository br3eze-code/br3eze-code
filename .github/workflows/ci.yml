name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Prepare Jest module path
        run: |
          mkdir -p /tmp/jest-deps
          cp package.json /tmp/jest-deps/
          cd /tmp/jest-deps && npm ci --ignore-scripts --legacy-peer-deps --prefer-offline 2>/dev/null || true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --forceExit --passWithNoTests --coverage
        env:
          NODE_ENV: test
          ROS_HOST: 127.0.0.1
          ROS_PORT: 8728
          ROS_USER: admin
          ROS_PASS: test
          MIKROTIK_HOST: 127.0.0.1
          MIKROTIK_USER: admin
          MIKROTIK_PASS: test
          DATA_BACKEND: local
          FIREBASE_PROJECT_ID: test-project
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          PORT: 3000
          GATEWAY_PORT: 19876

      - name: Type check
        run: npm run build:check
        continue-on-error: true

      - name: Security audit
        run: npm run security:audit
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.run_number }}
          path: coverage/
          retention-days: 14

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
