name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (skip lifecycle hooks)
        run: npm ci --ignore-scripts

      - name: Lint
        # Report-only for now: the repo carries pre-existing lint debt in legacy
        # modules. Lint still runs and its output is visible in the logs, but it
        # doesn't gate the build until the backlog is cleared.
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test -- --ci --forceExit --passWithNoTests
        env:
          NODE_ENV: test
          ROS_HOST: 127.0.0.1
          ROS_PORT: 8728
          ROS_USER: admin
          ROS_PASS: test
          MIKROTIK_HOST: 127.0.0.1
          MIKROTIK_USER: admin
          MIKROTIK_PASS: test
          DATA_BACKEND: local
          FIREBASE_PROJECT_ID: test-project
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          PORT: 3000
          GATEWAY_PORT: 19876

      - name: Type check
        run: npm run build:check
        continue-on-error: true  # JS project — tsc is advisory

      - name: Security audit (advisory)
        run: npm run security:audit
        env:
          NODE_ENV: test
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
