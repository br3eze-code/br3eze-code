name: 🧾 Daily Accounting Report

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
    # Run weekly on Monday at 2 AM UTC for full week report
    - cron: '0 2 * * 1'
  push:
    branches:
      - main
      - develop
    paths:
      - 'scripts/accounting-report.js'
      - '.github/workflows/accounting-report.yml'
      - 'package.json'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'scripts/accounting-report.js'
      - '.github/workflows/accounting-report.yml'
  workflow_dispatch:
    inputs:
      from:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2026-05-01'
      to:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-05-26'
      mode:
        description: 'Report mode'
        required: false
        default: 'daily'
      verbose:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: false

jobs:
  accounting-report:
    name: Generate Accounting Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false

    permissions:
      contents: read
      actions: read

    outputs:
      report_path: ${{ steps.report.outputs.path }}
      total_revenue: ${{ steps.report.outputs.total_revenue }}
      total_txns: ${{ steps.report.outputs.total_txns }}
      anomaly_count: ${{ steps.report.outputs.anomaly_count }}
      failure_rate: ${{ steps.report.outputs.failure_rate }}
      period: ${{ steps.report.outputs.period }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Validate script exists
        run: |
          if [ ! -f "scripts/accounting-report.js" ]; then
            echo "❌ Script not found: scripts/accounting-report.js"
            exit 1
          fi
          echo "✓ Script validated"

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "⚠️  FIREBASE_SERVICE_ACCOUNT not set — running in offline/mock mode"
            echo "FIREBASE_OFFLINE=true" >> $GITHUB_ENV
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
            chmod 600 /tmp/firebase-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json" >> $GITHUB_ENV
            echo "✓ Firebase credentials configured"
          fi

      - name: Calculate date range
        id: dates
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            FROM="${{ github.event.inputs.from }}"
            TO="${{ github.event.inputs.to }}"
          else
            # For scheduled runs: yesterday
            FROM=$(date -u -d 'yesterday' +%Y-%m-%d)
            TO=$(date -u -d 'yesterday' +%Y-%m-%d)
          fi
          
          echo "from=$FROM" >> $GITHUB_OUTPUT
          echo "to=$TO" >> $GITHUB_OUTPUT
          echo "📅 Report period: $FROM → $TO"

      - name: Run accounting report
        id: report
        run: |
          VERBOSE_FLAG=""
          if [ "${{ github.event.inputs.verbose }}" == "true" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            VERBOSE_FLAG="--verbose"
          fi
          
          node scripts/accounting-report.js \
            --from ${{ steps.dates.outputs.from }} \
            --to ${{ steps.dates.outputs.to }} \
            --mode ${{ github.event.inputs.mode || 'daily' }} \
            --out reports/accounting \
            $VERBOSE_FLAG
          
          echo "✓ Report generated successfully"

      - name: Validate report output
        id: validate
        run: |
          REQUIRED_FILES=(
            "reports/accounting/summary.json"
            "reports/accounting/report.csv"
            "reports/accounting/anomalies.json"
            "reports/accounting/summary.md"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✓ Found: $file"
          done
          
          echo "✓ All report files validated"

      - name: Display summary
        if: always()
        run: |
          if [ -f "reports/accounting/summary.json" ]; then
            echo "📊 Accounting Report Summary:"
            jq '.summary | to_entries[] | "  \(.key): \(.value)"' reports/accounting/summary.json
          fi

      - name: Check for anomalies
        id: anomalies
        if: always()
        run: |
          ANOMALY_FILE="reports/accounting/anomalies.json"
          if [ -f "$ANOMALY_FILE" ]; then
            TOTAL=$(jq 'length' "$ANOMALY_FILE")
            HIGH=$(jq '[.[] | select(.severity == "high")] | length' "$ANOMALY_FILE")
            MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' "$ANOMALY_FILE")
            LOW=$(jq '[.[] | select(.severity == "low")] | length' "$ANOMALY_FILE")
            
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
            echo "low=$LOW" >> $GITHUB_OUTPUT
            
            if [ "$HIGH" -gt 0 ]; then
              echo "⚠️  High-severity anomalies: $HIGH"
              jq '.[] | select(.severity == "high")' "$ANOMALY_FILE"
            fi
          fi

      - name: Upload reports to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accounting-reports-${{ steps.dates.outputs.from }}
          path: reports/accounting/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 9

      - name: Upload summary as JSON artifact
        if: always() && hashFiles('reports/accounting/summary.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: report-summary-json-${{ steps.dates.outputs.from }}
          path: reports/accounting/summary.json
          retention-days: 180

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/firebase-key.json
          echo "✓ Sensitive files cleaned up"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: accounting-report
    if: success()

    steps:
      - name: Post success summary
        run: |
          echo "## ✅ Accounting Report Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Revenue | ${{ needs.accounting-report.outputs.total_revenue }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Transactions | ${{ needs.accounting-report.outputs.total_txns }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Anomalies | ${{ needs.accounting-report.outputs.anomaly_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failure Rate | ${{ needs.accounting-report.outputs.failure_rate }}% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Reports retained for 90 days in workflow artifacts" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: accounting-report
    if: failure()

    steps:
      - name: Log failure
        run: |
          echo "❌ Accounting report job failed"
          echo ""
          echo "Possible causes:"
          echo "  • Firebase credentials not configured (FIREBASE_SERVICE_ACCOUNT secret)"
          echo "  • Network issues accessing Firestore"
          echo "  • Invalid date range provided"
          echo "  • Script runtime error"
          echo ""
          echo "📋 Check workflow logs for details:"
          echo "   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: accounting-report
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: accounting-reports-${{ github.run_id }}
          path: reports/
        continue-on-error: true

      - name: Validate data quality
        if: hashFiles('reports/accounting/anomalies.json') != ''
        run: |
          ANOMALIES=$(cat reports/accounting/anomalies.json)
          HIGH_COUNT=$(echo "$ANOMALIES" | jq '[.[] | select(.severity == "high")] | length')
          
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "⚠️  Quality gate: High-severity anomalies detected ($HIGH_COUNT)"
            echo "$ANOMALIES" | jq '.[] | select(.severity == "high")'
            
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              exit 1
            fi
          else
            echo "✓ Quality gate passed: No high-severity anomalies"
          fi
