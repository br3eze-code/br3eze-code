<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signing in…</title>
</head>
<body>
  <p id="status">Completing sign-in…</p>
  <script src="../js/env.js"></script>
  <script>
    const KEY = 'agentos_supabase_session';
    const VERIFIER_KEY = 'agentos_oauth_pkce_verifier';
    const RETURN_TO_KEY = 'agentos_oauth_return_to';
    const status = document.getElementById('status');
    const runtime = window.ENV || {};
    const supabaseUrl = String(runtime.SUPABASE_URL || '').replace(/\/$/, '');

    async function exchangeCode(code, verifier) {
      const response = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=pkce`, {
        method: 'POST',
        headers: { apikey: runtime.SUPABASE_PUBLISHABLE_KEY || runtime.SUPABASE_ANON_KEY || '', 'Content-Type': 'application/json' },
        body: JSON.stringify({ auth_code: code, code_verifier: verifier })
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.msg || body.error_description || body.error || 'OAuth token exchange failed.');
      return body;
    }

    async function verifyEmailLink(tokenHash, type) {
      const response = await fetch(`${supabaseUrl}/auth/v1/verify`, {
        method: 'POST',
        headers: { apikey: runtime.SUPABASE_PUBLISHABLE_KEY || runtime.SUPABASE_ANON_KEY || '', 'Content-Type': 'application/json' },
        body: JSON.stringify({ token_hash: tokenHash, type: type || 'signup' })
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.msg || body.error_description || body.error || 'Email verification failed.');
      return body;
    }

    (async function () {
      try {
        const query = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const error = query.get('error_description') || query.get('error') || hash.get('error_description') || hash.get('error');
        if (error) throw new Error(error);

        const code = query.get('code');
        const tokenHash = query.get('token_hash');
        const verifier = localStorage.getItem(VERIFIER_KEY);
        if (!supabaseUrl) throw new Error('Supabase Auth is not configured.');

        let session;
        if (code && verifier) {
          session = await exchangeCode(code, verifier);
        } else if (tokenHash) {
          session = await verifyEmailLink(tokenHash, query.get('type'));
        } else {
          const accessToken = hash.get('access_token');
          const refreshToken = hash.get('refresh_token');
          if (!accessToken) throw new Error('OAuth code, email verification token, or access token is missing.');
          session = {
            access_token: accessToken,
            refresh_token: refreshToken,
            token_type: hash.get('token_type') || 'bearer',
            expires_in: Number(hash.get('expires_in') || 3600),
            user: null
          };
        }
        if (!session?.access_token) throw new Error('Supabase did not return an authenticated session.');
        localStorage.setItem(KEY, JSON.stringify(session));
        localStorage.removeItem(VERIFIER_KEY);
        const requestedReturn = localStorage.getItem(RETURN_TO_KEY);
        localStorage.removeItem(RETURN_TO_KEY);
        let destination = new URL('../', window.location.href);
        if (requestedReturn) {
          try {
            const candidate = new URL(requestedReturn, window.location.origin);
            if (candidate.origin === window.location.origin) destination = candidate;
          } catch { /* stay on the same origin's app root */ }
        }
        window.location.replace(destination.href);
      } catch (e) {
        localStorage.removeItem(VERIFIER_KEY);
        status.textContent = 'Sign-in failed: ' + (e.message || 'Unknown authentication error.');
      }
    })();
  </script>
</body>
</html>
