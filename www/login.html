<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Login · Br3eze Hotspot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      max-width: 420px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .login-card {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-cyan);
    }
    .login-title {
      font-family: var(--font-hdr);
      font-size: 20px;
      color: var(--cyan);
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: 3px;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      color: var(--text-dim);
      font-family: var(--font-hdr);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .form-input {
      background: var(--bg2);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--cyan);
    }
    .btn-login {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--cyan);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: var(--font-hdr);
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
      transition: opacity 0.2s;
      margin-top: 24px;
    }
    .btn-login:active {
      opacity: 0.8;
    }
    .error-box {
      background: rgba(255,51,85,0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 12px;
      text-align: center;
    }
    .qr-scanner-btn {
      background: var(--bg2);
      border: 1px solid var(--border-dim);
      color: var(--cyan);
      padding: 8px;
      border-radius: var(--radius);
      font-family: var(--font-hdr);
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-sigil">◈</span>
        <span class="brand-name">AGENT<span class="brand-accent">OS</span></span>
        <span class="brand-ver">HOTSPOT</span>
      </div>
      <div class="header-status">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>SIGN IN</span>
        </div>
      </div>
    </header>

    <main class="app-main" style="overflow-y: auto;">
      <div class="login-container">
        <div class="login-card">
          <div class="login-title">WIFI LOGIN</div>

          $(if error)
          <div class="error-box">
            $(error)
          </div>
          $(endif)

          <form name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />

            <div class="form-group">
              <label for="username">VOUCHER CODE / USERNAME</label>
              <input type="text" id="username" name="username" class="form-input" placeholder="Enter code or username" value="$(username)" required autocomplete="username">
            </div>

            <div class="form-group">
              <label for="password">PASSWORD (LEAVE BLANK FOR VOUCHER)</label>
              <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">CONNECT</button>
          </form>

          <button id="qr-btn" class="qr-scanner-btn" onclick="toggleQR()">◈ SCAN VOUCHER QR</button>
          <div id="qr-reader" style="width: 100%; display: none; margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/html5-qrcode.min.js"></script>
  <script>
    let html5QrcodeScanner = null;
    function toggleQR() {
      const readerDiv = document.getElementById('qr-reader');
      const btn = document.getElementById('qr-btn');
      if (readerDiv.style.display === 'none') {
        readerDiv.style.display = 'block';
        btn.textContent = '✕ CLOSE SCANNER';
        startQR();
      } else {
        stopQR();
      }
    }

    function startQR() {
      html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render((decodedText) => {
        let code = decodedText.trim();
        if (code.includes('?code=')) {
          const urlParams = new URLSearchParams(code.split('?')[1]);
          code = urlParams.get('code') || code;
        }
        document.getElementById('username').value = code;
        document.getElementById('password').value = '';
        stopQR();
        if (code) {
          document.forms['login'].submit();
        }
      }, (error) => {
        // ignore scanning errors
      });
    }

    function stopQR() {
      const readerDiv = document.getElementById('qr-reader');
      const btn = document.getElementById('qr-btn');
      readerDiv.style.display = 'none';
      btn.textContent = '◈ SCAN VOUCHER QR';
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error("Error clearing scanner", err));
        html5QrcodeScanner = null;
      }
    }
  </script>
</body>
</html>
