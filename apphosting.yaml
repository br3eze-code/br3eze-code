# Firebase App Hosting configuration for the repository root.
# This file is intentionally App Hosting syntax, not a Cloud Run Knative manifest.
# Cloud Run deployments should use a separate service manifest.

runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 80
  minInstances: 1
  maxInstances: 10
  timeoutSeconds: 300

scripts:
  buildCommand: npm run build
  runCommand: npm run start:modern

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: PORT
    value: "8080"
    availability:
      - RUNTIME
  - variable: GATEWAY_PORT
    value: "8080"
    availability:
      - RUNTIME
  - variable: GATEWAY_HOST
    value: 0.0.0.0
    availability:
      - RUNTIME
  - variable: HOSTNAME
    value: 0.0.0.0
    availability:
      - RUNTIME
  - variable: GCP_PROJECT_ID
    value: br3eze-africa-312df
    availability:
      - RUNTIME
  - variable: GCP_REGION
    value: africa-south1
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: br3eze-africa-312df
    availability:
      - RUNTIME
  - variable: LOG_LEVEL
    value: info
    availability:
      - RUNTIME
  - variable: LOG_FORMAT
    value: json
    availability:
      - RUNTIME

# Add secrets in Firebase App Hosting or Secret Manager; never commit values here.
# env:
#   - variable: SUPABASE_URL
#     secret: SUPABASE_URL
#     availability: [RUNTIME]
#   - variable: SUPABASE_SERVICE_ROLE_KEY
#     secret: SUPABASE_SERVICE_ROLE_KEY
#     availability: [RUNTIME]

            # ---- Skills & AI --------------------------------------------
            - name: SKILLS_PATH
              value: /app/src/skills
            - name: AI_MODEL_CACHE_PATH
              value: /tmp/models
            - name: AI_MAX_TOKENS_PER_REQUEST
              value: "4096"
            - name: AI_REQUEST_TIMEOUT_MS
              value: "30000"
            - name: ENABLE_AI_FALLBACK
              value: "true"              # Fallback to local model if APIs fail

            # ---- Network & MikroTik -------------------------------------
            - name: MIKROTIK_CONNECTION_TIMEOUT_MS
              value: "10000"
            - name: MIKROTIK_MAX_CONCURRENT_CONNECTIONS
              value: "50"
            - name: NETWORK_HEALTH_CHECK_INTERVAL_MS
              value: "30000"

            # ---- Rate limiting & circuit breaker ------------------------
            - name: RATE_LIMIT_REQUESTS_PER_MINUTE
              value: "1000"
            - name: CIRCUIT_BREAKER_FAILURE_THRESHOLD
              value: "5"
            - name: CIRCUIT_BREAKER_RESET_TIMEOUT_MS
              value: "30000"

            # ---- Core auth (Secret Manager) -----------------------------
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-token
                  key: latest
            - name: AUDIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: audit-secret
                  key: latest

            # ---- AI providers (Secret Manager) --------------------------
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: latest

            # ---- MikroTik (Secret Manager) ------------------------------
            - name: DRIVER_MIKROTIK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mikrotik-api-token
                  key: latest

            # ---- Payments (Secret Manager) ------------------------------
            - name: PAYNOW_INTEGRATION_ID
              valueFrom:
                secretKeyRef:
                  name: paynow-integration-id
                  key: latest
            - name: PAYNOW_INTEGRATION_KEY
              valueFrom:
                secretKeyRef:
                  name: paynow-integration-key
                  key: latest
            - name: MASTERCARD_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: mastercard-consumer-key
                  key: latest
            - name: MASTERCARD_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: mastercard-consumer-secret
                  key: latest

            # ---- Messaging (Secret Manager) -----------------------------
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-token
                  key: latest

            # ---- AWS (Secret Manager, optional) -------------------------
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-access-key-id
                  key: latest
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret-access-key
                  key: latest

            # ---- Database (Secret Manager, if using Cloud SQL) ----------
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: database-url
            #       key: latest

            # ---- Redis (Secret Manager, for session caching) ------------
            # - name: REDIS_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: redis-url
            #       key: latest

          ##################################################################
          # Volume mounts — GCP SA key + ephemeral model cache
          ##################################################################
          volumeMounts:
            - name: gcp-sa-key
              mountPath: /var/secrets/gcp
              readOnly: true
            - name: tmp-sessions
              mountPath: /tmp/sessions
            - name: tmp-models
              mountPath: /tmp/models
            # Optional: Mount config map for feature flags
            # - name: feature-flags
            #   mountPath: /app/config
            #   readOnly: true

          ##################################################################
          # Health probes — comprehensive app health
          ##################################################################
          startupProbe:
            httpGet:
              path: /health/startup
              port: 3000
              httpHeaders:
                - name: X-Health-Check
                  value: "true"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10       # 50s max startup (AI model loading)
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
              httpHeaders:
                - name: X-Health-Check
                  value: "true"
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
              httpHeaders:
                - name: X-Health-Check
                  value: "true"
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
            successThreshold: 1

      ##################################################################
      # Volumes — secrets + ephemeral storage
      ##################################################################
      volumes:
        - name: gcp-sa-key
          secret:
            secretName: gcp-sa-key
            items:
              - key: latest
                path: sa-key.json
                mode: 0400
        - name: tmp-sessions
          emptyDir:
            medium: Memory             # tmpfs — fast, auto-cleared
            sizeLimit: 100Mi
        - name: tmp-models
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
        # Optional: Feature flags config map
        # - name: feature-flags
        #   configMap:
        #     name: agentos-features
        #     items:
        #       - key: flags.json
        #         path: flags.json

  ##################################################################
  # Traffic — blue/green ready with tag-based routing
  ##################################################################
  traffic:
    - percent: 100
      latestRevision: true
      tag: prod                        # Route: prod-agentos-xxx.a.run.app
    # - percent: 0
    #   revisionName: agentos-00001-abc
    #   tag: canary                    # Route: canary-agentos-xxx.a.run.app

  ##################################################################
  # IAM — service-level access (supplement with gcloud commands)
  ##################################################################
  # See Quick-start commands below for IAM bindings

---
