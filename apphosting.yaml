# Firebase App Hosting configuration for the repository root.
# Domain integrations remain behind adapters and plugins; secrets belong in Secret Manager.

runConfig:
  cpu: 2
  memoryMiB: 2048
  concurrency: 80
  minInstances: 1
  maxInstances: 10
  timeoutSeconds: 300

scripts:
  buildCommand: npm run build
  runCommand: npm run start:modern

env:
  - variable: NODE_ENV
    value: production
    availability: [RUNTIME]
  - variable: PORT
    value: "8080"
    availability: [RUNTIME]
  - variable: GATEWAY_PORT
    value: "8080"
    availability: [RUNTIME]
  - variable: GATEWAY_HOST
    value: 0.0.0.0
    availability: [RUNTIME]
  - variable: HOSTNAME
    value: 0.0.0.0
    availability: [RUNTIME]
  - variable: GCP_PROJECT_ID
    value: br3eze-africa-312df
    availability: [RUNTIME]
  - variable: GCP_REGION
    value: africa-south1
    availability: [RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: br3eze-africa-312df
    availability: [RUNTIME]
  - variable: LOG_LEVEL
    value: info
    availability: [RUNTIME]
  - variable: LOG_FORMAT
    value: json
    availability: [RUNTIME]

# Add secrets in Firebase App Hosting or Google Secret Manager; never commit values here.
# Example:
# env:
#   - variable: SUPABASE_URL
#     secret: SUPABASE_URL
#     availability: [RUNTIME]
#   - variable: SUPABASE_SERVICE_ROLE_KEY
#     secret: SUPABASE_SERVICE_ROLE_KEY
#     availability: [RUNTIME]

# App Hosting injects its PORT. The modern start command must listen on 0.0.0.0.
# Cloud Run/Helm/Kubernetes manifests belong in their respective deployment files.
